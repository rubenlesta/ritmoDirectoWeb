<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ritmo Directo</title>
    <meta name="description" content="Tu música local, siempre a mano.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
    <meta name="theme-color" content="#121212">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Ritmo Directo">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='icons/apple-touch-icon.png') }}">
</head>

<body>
    <div id="loading-bar"></div>
    <div id="toast-container"></div>

    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div class="logo">
                <i class="fa-solid fa-music"></i> Ritmo Directo
            </div>

            <div class="sidebar-section">
                <h3><i class="fa-solid fa-compact-disc"></i> Álbumes</h3>
                <div id="listaAlbumes" class="album-list">
                    <!-- Albumes cargados dinámicamente -->
                </div>
                <button class="btn-text" onclick="crearAlbum()">
                    <i class="fa-solid fa-plus"></i> Nuevo Álbum
                </button>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="content">
            <header class="top-bar">
                <div class="search-bar">
                    <i class="fa-solid fa-search"></i>
                    <input type="text" id="busquedaInput" placeholder="Buscar canción..." onkeyup="buscar()">
                </div>

                <div class="actions">
                    <button class="btn-upload" onclick="triggerUpload()" title="Subir MP3s">
                        <i class="fa-solid fa-cloud-arrow-up"></i> Subir MP3
                    </button>
                    <input type="file" id="mp3UploadInput" multiple hidden accept=".mp3">

                    <div class="download-group">
                        <input type="text" id="urlInput" placeholder="URL Youtube">
                        <button class="btn-primary" onclick="descargar()" title="Descargar">
                            <i class="fa-solid fa-download"></i>
                        </button>
                    </div>
                </div>
            </header>

            <div class="song-list-container">
                <table id="cancionesLista">
                    <thead>
                        <tr>
                            <th class="selection-column">
                                <label class="checkbox-wrapper-custom">
                                    <input type="checkbox" id="selectAllCheckbox" onclick="toggleSelectAll(this)">
                                    <span class="custom-checkmark"></span>
                                </label>
                            </th>
                            <th class="number-column">#</th>
                            <th class="track-column">Canción</th>
                            <th class="duration-column" aria-label="Duración">
                                <i class="fa-regular fa-clock" aria-hidden="true"></i>
                            </th>
                            <th class="actions-column"></th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- Canciones cargadas dinámicamente -->
                    </tbody>
                </table>
                <div id="emptyState" class="empty-state" style="display: none;">
                    <i class="fa-solid fa-music"></i>
                    <p>No hay canciones</p>
                </div>
            </div>
        </main>

    </div>

    <button class="queue-backdrop" id="queueBackdrop" type="button"
        aria-label="Cerrar cola"></button>
    <aside class="queue-sidebar" id="queueSidebar" aria-hidden="true">
        <div class="queue-header">
            <h3>Cola de reproducción</h3>
            <button class="action-btn-small" id="queueCloseButton" type="button"
                title="Cerrar cola" aria-label="Cerrar cola">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>
        <section class="queue-section">
            <div class="queue-section-heading">
                <h4>En cola</h4>
                <button id="clearQueueButton" class="queue-clear" type="button" onclick="clearQueue()">
                    Vaciar
                </button>
            </div>
            <div id="queueList" class="queue-list"></div>
        </section>
        <section class="queue-section upcoming-section">
            <div class="queue-section-heading">
                <h4>A continuación</h4>
                <span id="queueModeLabel"></span>
            </div>
            <div id="upcomingList" class="queue-list"></div>
        </section>
    </aside>

    <!-- Context Menu -->
    <div id="contextMenu" class="context-menu" style="display: none;">
        <button class="menu-item" id="ctxAddQueue" type="button">
            <i class="fa-solid fa-list-ol"></i> Añadir a la cola
        </button>
        <button class="menu-item" id="ctxAddAlbum" type="button">
            <i class="fa-solid fa-folder-plus"></i> Añadir a álbum
        </button>
        <button class="menu-item" id="ctxDelete" type="button">
            <i class="fa-solid fa-trash"></i> Borrar canción
        </button>
    </div>

    <div class="album-dialog-backdrop" id="albumDialogBackdrop" aria-hidden="true">
        <section class="album-dialog" role="dialog" aria-modal="true"
            aria-labelledby="albumDialogTitle">
            <div class="album-dialog-header">
                <h3 id="albumDialogTitle">Añadir a álbum</h3>
                <button type="button" class="action-btn-small" onclick="closeAlbumDialog()"
                    aria-label="Cerrar"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <label for="albumSelect">Álbum existente</label>
            <select id="albumSelect"></select>
            <button type="button" id="showCreateAlbum" class="btn-text">
                <i class="fa-solid fa-plus"></i> Crear nuevo álbum
            </button>
            <div id="createAlbumFields" class="create-album-fields" hidden>
                <label for="newAlbumName">Nombre del nuevo álbum</label>
                <input id="newAlbumName" type="text" maxlength="255" autocomplete="off">
            </div>
            <div class="album-dialog-actions">
                <button type="button" class="btn-text" onclick="closeAlbumDialog()">Cancelar</button>
                <button type="button" class="btn-primary" id="confirmAlbumAdd">Añadir</button>
            </div>
        </section>
    </div>

    <section class="download-progress" id="downloadProgress" aria-live="polite" hidden>
        <div class="download-progress-heading">
            <strong id="downloadProgressMessage">Obteniendo información...</strong>
            <span id="downloadProgressPercent">0%</span>
        </div>
        <div class="download-progress-track" role="progressbar"
            aria-label="Progreso de descarga" aria-valuemin="0"
            aria-valuemax="100" aria-valuenow="0">
            <div class="download-progress-fill" id="downloadProgressFill"></div>
        </div>
        <span class="download-progress-speed" id="downloadProgressSpeed"></span>
    </section>

    <!-- Player Bar -->
    <footer class="player-bar">
        <div class="now-playing">
            <div class="track-art" aria-hidden="true">
                <i class="fa-solid fa-music"></i>
            </div>
            <div class="track-info">
                <div class="track-title" id="cancionActual">Selecciona una canción</div>
                <div class="track-artist" id="artistaActual">-</div>
            </div>
        </div>

        <div class="player-controls-container">
            <div class="controls">
                <button class="btn-control active" onclick="cambiarModo()" id="modoReproduccion"
                    title="Aleatorio" aria-label="Desactivar modo aleatorio" aria-pressed="true">
                    <i class="fa-solid fa-shuffle"></i>
                </button>
                <button class="btn-control" onclick="reiniciarCancion()">
                    <i class="fa-solid fa-backward-step"></i>
                </button>
                <button class="btn-control play-btn" onclick="togglePlayPause()">
                    <i class="fa-solid fa-play" id="playIcon"></i>
                </button>
                <button class="btn-control" onclick="reproducirSiguienteCancion()">
                    <i class="fa-solid fa-forward-step"></i>
                </button>
                <button class="btn-control" id="repeatToggle" type="button"
                    onclick="toggleRepeatMode()" title="Repetir desactivado"
                    aria-label="Activar repetición" aria-pressed="false">
                    <i class="fa-solid fa-repeat"></i>
                </button>
            </div>
            <div class="progress-area">
                <span id="currentTime">0:00</span>
                <div class="progress-bar-wrapper" role="slider" tabindex="0"
                    aria-label="Progreso de reproducción" aria-valuemin="0"
                    aria-valuemax="100" aria-valuenow="0" onclick="seek(event)">
                    <div class="progress-fill" id="progress"></div>
                </div>
                <span id="duration">0:00</span>
            </div>
        </div>

        <div class="player-utilities">
            <button class="btn-control" id="queueToggle" type="button"
                title="Mostrar cola" aria-label="Mostrar cola" aria-expanded="false">
                <i class="fa-solid fa-list-ol"></i>
            </button>
            <div class="volume-control">
                <button class="btn-control" id="volumeToggle" type="button" onclick="toggleMute()" title="Silenciar" aria-label="Silenciar">
                    <i class="fa-solid fa-volume-high"></i>
                </button>
                <input id="volumeSlider" type="range" min="0" max="1" step="0.01" value="1"
                    aria-label="Volumen" title="Volumen" oninput="setVolume(this.value)">
            </div>
        </div>
    </footer>

    <audio id="audioPlayer" style="display: none;" preload="metadata"></audio>
    <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>

</html>
